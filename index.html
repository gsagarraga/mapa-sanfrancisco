 4 tomados del plano catastral municipal (Parque de Las Rosas, Loteo Chacras del Norte, Loteo Los Robles y Futuro Loteo Vallari). Los loteos que el plano marca dentro de un barrio aparecen al pasar el mouse en la vista Barrios.</p>\n  <h3>Cómo se calculan los barrios</h3>\n  <p>Cada radio se reparte entre los barrios que lo cubren en proporción a la superficie, suponiendo población pareja dentro del radio. Se suman los conteos y después se calculan los porcentajes. El radio mixto se reparte solo entre las zonas con barrio; el Futuro Loteo Vallari no recibe población porque no tenía viviendas en 2022. ${h(Ua.pop_outside,"int")} habitantes (${h(100*Ua.pop_outside/Ua.pop_total,"float1")}%) quedan fuera de los barrios.</p>\n  <h3>Colores y clases</h3>\n  <p>Los indicadores con sentido mejor o peor usan una escala divergente: gris cerca del promedio de toda la ciudad, rojo cuando el valor es peor y azul pizarra cuando es mejor, con tres clases a cada lado. Los indicadores descriptivos usan una sola tonalidad, de claro a oscuro. Las clases se cortan por cortes naturales (Jenks). Los colores tienen pasos de luminosidad parejos y se distinguen con daltonismo.</p>\n  <h3>Cruces</h3>\n  <p>Cruza dos indicadores. Cada radio (o barrio) queda en uno de cuatro sectores según esté por encima o por debajo del valor de toda la ciudad en cada uno; en pálido, los que están cerca del promedio (±15 % del desvío) en alguno de los dos. La fuerza de la relación es la correlación de Pearson ponderada por población. Compara lugares, no personas (falacia ecológica), y no prueba causalidad. Por barrio los valores son estimaciones: conviene leer la relación en los radios.</p>\n  <h3>Focos (I de Moran)</h3>\n  <p>La vista Focos muestra dónde se juntan barrios vecinos con valores altos (o bajos). Usa el I de Moran, que mide si los barrios con valores parecidos están juntos. Vecinos: barrios cuyos límites se tocan (tolerancia 15 m). Global con 9.999 permutaciones; local con 999 y p &lt; 0,05, sin
